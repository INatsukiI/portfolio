name: Setup
description: Node.js セットアップと依存インストール
inputs:
  node-version:
    description: Node.js バージョン
    default: "24"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
