name: CI

on:
  # main への PR で必須チェックを走らせる（Dependabot PR 含む）。
  # feature/** ・ fix/** への push 単体では走らない —— マージは必ず PR 経由で、
  # PR を開いた時点で CI が回る。push トリガーを併用すると同一ブランチで
  # 二重起動し、concurrency の cancel-in-progress でキャンセルされた方の
  # チェックが branch protection をブロックし続けるため、あえて外している。
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run check
      - run: npm run test
      - run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # ブラウザバイナリのダウンロードで時間が伸びるため Lint & Build & Test とは別ジョブにしている
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
