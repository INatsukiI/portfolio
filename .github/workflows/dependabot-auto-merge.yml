name: Dependabot auto-merge

# Dependabot の PR のうち patch / minor 更新だけを GitHub ネイティブの
# auto-merge に載せる。実際のマージは branch protection の必須チェック
# 「Lint & Build & Test」が緑になった後に GitHub が自動で行う。
# major 更新・チェック失敗・グループ内に major を含む PR は対象外で、
# 人間 or `/review-dependabot` スキルでの確認に回る。

on: pull_request

permissions: {}

jobs:
  auto-merge:
    # Dependabot 以外の PR では何もしない
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch / minor updates
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
